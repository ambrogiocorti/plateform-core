# Ephemeral GitHub runner only. No application migrations or seed are copied
# into this CLI workdir: the shared guarded installer runs after platform init.
project_id = "plateform-clean-install-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
enable_signup = false
enable_anonymous_sign_ins = false
jwt_expiry = 900
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[analytics]
enabled = false
