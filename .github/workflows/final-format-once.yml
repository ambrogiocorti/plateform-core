name: Final one-time formatting
on:
  push:
    branches:
      - feat/audit-commercial-hardening-20261011
    paths:
      - .github/workflows/final-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run format:check
      - run: npm run check:migrations
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format finalized audit and rollout documents"
            git push origin HEAD:refs/heads/feat/audit-commercial-hardening-20261011
          fi
