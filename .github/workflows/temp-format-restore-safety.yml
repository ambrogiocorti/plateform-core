name: Temporary restore safety formatting
on:
  push:
    branches:
      - fix/p0-continuity-capacity-20261010
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed restore safety files
        run: >-
          npx prettier --write
          tools/restore-test-worker/config.mjs
          scripts/check-restore-test-target-preflight.mjs
      - name: Verify formatting
        run: >-
          npx prettier --check
          tools/restore-test-worker/config.mjs
          scripts/check-restore-test-target-preflight.mjs
      - name: Commit scoped formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/restore-test-worker/config.mjs scripts/check-restore-test-target-preflight.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format restore target safety checks"
            git push origin HEAD:fix/p0-continuity-capacity-20261010
          fi
