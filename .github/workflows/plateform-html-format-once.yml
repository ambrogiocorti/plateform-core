name: Plateform HTML formatter (one-time)
on:
  push:
    branches: [feature/customer-experience-light-theme-20261027]
    paths: ['.github/workflows/plateform-html-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          node node_modules/prettier/bin/prettier.cjs --write apps/public/index.html
          npm run format:check
      - name: Save HTML layout formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'style(html): format public no-script fallback'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
