name: Apply isolated formatting baseline
on:
  push:
    branches:
      - chore/format-baseline-20261010
permissions:
  contents: write
jobs:
  apply_format_once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply configured repository formatter
        run: npm run format
      - name: Validate changed files
        run: |
          git diff --check
          npm run format:check
      - name: Commit only formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize existing Plateform source and evidence formatting'
            git push
          fi
