name: Plateform UX structural formatting (one-time)
on:
  push:
    branches:
      - feature/customer-experience-light-theme-20261027
    paths:
      - '.github/workflows/plateform-ux-formatter-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Prettier to new page architectures
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            src/pages/admin-operations.ts \
            src/pages/kitchen.ts \
            apps/staff/main.ts apps/public/main.ts \
            styles/workspace-redesign.css styles/restaurant-redesign.css \
            scripts/check-step11-static.mjs scripts/check-visual-design.mjs
          npm run format:check
      - name: Save exact formatted files on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/admin-operations.ts src/pages/kitchen.ts apps/staff/main.ts apps/public/main.ts styles/workspace-redesign.css styles/restaurant-redesign.css scripts/check-step11-static.mjs scripts/check-visual-design.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(ux): format structural redesign'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
