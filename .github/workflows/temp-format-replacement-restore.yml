name: Temporary replacement restore formatting
on:
  push:
    branches:
      - fix/p0-restore-replacement-safety-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize only new restore safety checks
        run: >-
          npx prettier --write
          scripts/check-restore-replacement-safety.test.mjs
          scripts/check-continuity-project-binding.mjs
      - name: Confirm normalized test formatting
        run: >-
          npx prettier --check
          scripts/check-restore-replacement-safety.test.mjs
          scripts/check-continuity-project-binding.mjs
      - name: Commit scoped formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-restore-replacement-safety.test.mjs scripts/check-continuity-project-binding.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize replacement restore safety tests"
            git push origin HEAD:fix/p0-restore-replacement-safety-20261010
          fi
