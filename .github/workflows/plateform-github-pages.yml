name: Plateform GitHub Pages candidate

on:
  workflow_dispatch:
    inputs:
      site_origin:
        description: 'HTTPS origin on a custom domain, e.g. https://restaurant.example.org (no path or trailing slash)'
        type: string
        required: true
      publish_after_approval:
        description: 'Deploy ONLY from main after real staging/browser/device approval'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: plateform-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: staging
    env:
      PUBLIC_SITE_ORIGIN: ${{ inputs.site_origin }}
      VITE_PUBLIC_BASE_URL: ${{ inputs.site_origin }}
      VITE_STAFF_BASE_URL: ${{ format('{0}/staff', inputs.site_origin) }}
      PAGES_CUSTOM_DOMAIN: ${{ inputs.site_origin }}
      VITE_ENVIRONMENT: staging
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_RELEASE_VERSION: '0.1.0'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Node.js 24 and reproducible npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate root custom domain and staging backend
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'STAGING_SUPABASE_URL missing'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'STAGING_SUPABASE_PUBLISHABLE_KEY missing'; exit 1; }
          node --input-type=module -e '
            const raw = process.env.PUBLIC_SITE_ORIGIN;
            const url = new URL(raw);
            if (url.protocol !== "https:" || url.origin !== raw || url.pathname !== "/" || url.search || url.hash || url.port || url.username || url.password || url.hostname.endsWith(".github.io") || !/^[a-z0-9.-]+$/.test(url.hostname)) {
              throw Error("GitHub Pages on plateform-core requires a root HTTPS custom domain; repository /plateform-core/ paths are not supported by the current router");
            }
          '
          echo "PAGES_CUSTOM_DOMAIN=${PUBLIC_SITE_ORIGIN#https://}" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Formatting and guarded public/staff build
        run: |
          npm run format:check
          npm run build:pages
      - name: Preserve static candidate for manual review (does not publish)
        uses: actions/upload-artifact@v4
        with:
          name: plateform-pages-candidate
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages only for explicit release from main
        if: github.ref == 'refs/heads/main' && inputs.publish_after_approval == true
        uses: actions/configure-pages@v5
      - name: Stage Pages deployment artifact only for explicit release from main
        if: github.ref == 'refs/heads/main' && inputs.publish_after_approval == true
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site/

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.publish_after_approval == true
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only after explicit operator request and environment approval
        id: deployment
        uses: actions/deploy-pages@v4
