name: Perizia UX safe candidate checks

on:
  push:
    branches:
      - fix/perizia-ux-20261103

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply mechanical Prettier formatting in the isolated branch
        run: |
          node node_modules/prettier/bin/prettier.cjs --write apps/public/main.ts src/pages/public-booking.ts src/pages/cash.ts src/pages/host.ts supabase/functions/reservation/index.ts styles/public-app.css styles/public.css styles/restaurant-redesign.css tests/e2e/public-experience.spec.ts
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- apps/public/main.ts src/pages/public-booking.ts src/pages/cash.ts src/pages/host.ts supabase/functions/reservation/index.ts styles/public-app.css styles/public.css styles/restaurant-redesign.css tests/e2e/public-experience.spec.ts
            git commit -m 'style(perizia): apply Prettier to isolated UX fixes'
            git push origin "HEAD:$GITHUB_REF"
          fi
      - name: Formatting of changed sources
        run: node node_modules/prettier/bin/prettier.cjs --check apps/public/main.ts src/pages/public-booking.ts src/pages/cash.ts src/pages/host.ts supabase/functions/reservation/index.ts styles/public-app.css styles/public.css styles/restaurant-redesign.css tests/e2e/public-experience.spec.ts
      - name: TypeScript
        if: success() || failure()
        run: npm run typecheck
      - name: Host UX contract
        if: success() || failure()
        run: npm run check:host-ux
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      - name: Database tests in PGlite
        if: success() || failure()
        run: npm run test:db
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: Install Chromium
        if: success() || failure()
        run: npx playwright install --with-deps chromium
      - name: Browser regression - guest menu
        if: success() || failure()
        run: npx playwright test tests/e2e/public-experience.spec.ts --reporter=line
      - name: Screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perizia-ux-e2e-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
