name: Temporary CLI migration scaffolding
on:
  push:
    branches:
      - integration/p0-recovery-format-20261010
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Scaffold exactly one versioned migration
        run: |
          set -euo pipefail
          if find supabase/migrations -maxdepth 1 -name '*_recover_unversioned_operational_rpcs.sql' | grep -q .; then
            echo 'MIGRATION_ALREADY_SCAFFOLDED'
            exit 0
          fi
          supabase migration new recover_unversioned_operational_rpcs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/
          git commit -m "db: scaffold migration for recovered operational RPC functions"
          git push origin HEAD:integration/p0-recovery-format-20261010
