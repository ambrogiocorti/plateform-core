name: P0 local Auth Storage and Realtime multi-venue gate
on:
  push:
    branches:
      - test/p0-realtime-ws-tenant-20261011
  pull_request:
permissions:
  contents: read
jobs:
  local_realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable 459 migration local Auth REST Storage and Realtime
        run: >-
          supabase start --exclude
          studio,mailpit,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Exercise MFA JWT API Storage and Postgres Changes WebSocket isolation
        env:
          PLATEFORM_TEST_REALTIME: '1'
        run: node scripts/check-step10-auth-http.mjs
      - name: Verify transport test and workflow formatting
        run: >-
          npx prettier --check
          scripts/check-step10-auth-http.mjs
          .github/workflows/step10-realtime-websocket.yml
      - name: Diagnose local replication catalog on transport failure
        if: failure()
        run: |
          set -euo pipefail
          db="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db"
          docker exec "$db" psql -U postgres -d postgres -X -c "show wal_level;"
          docker exec "$db" psql -U postgres -d postgres -X -c "select pubname,schemaname,tablename from pg_publication_tables where pubname='supabase_realtime' order by schemaname,tablename;"
          docker exec "$db" psql -U postgres -d postgres -X -c "select slot_name,plugin,active from pg_replication_slots order by slot_name;"
          docker exec "$db" psql -U postgres -d postgres -X -c "select schemaname,tablename,policyname from pg_policies where schemaname='public' and tablename='realtime_signals';"
      - name: Stop disposable local services and remove test fixtures
        if: always()
        run: supabase stop --no-backup || true
