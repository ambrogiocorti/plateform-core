name: Audit professional focused checks
on:
  push:
    paths:
      - 'src/pages/audit.ts'
      - 'tests/database/audit-professional.test.ts'
      - 'supabase/migrations/*audit_*.sql'
      - '.github/workflows/audit-professional.yml'
  pull_request:
    paths:
      - 'src/pages/audit.ts'
      - 'tests/database/audit-professional.test.ts'
      - 'supabase/migrations/*audit_*.sql'
      - '.github/workflows/audit-professional.yml'
permissions:
  contents: read
jobs:
  verify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node node_modules/vitest/vitest.mjs run tests/database/audit-professional.test.ts
