name: Temporary P0 runbook markdown formatting
on:
  push:
    branches:
      - integration/p0-staging-continuity-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/operations/P0_REHEARSAL_RETENTION_PLAN_2026-10-10.md
      - run: npx prettier --check docs/operations/P0_REHEARSAL_RETENTION_PLAN_2026-10-10.md
      - name: Commit single-file formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/P0_REHEARSAL_RETENTION_PLAN_2026-10-10.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format P0 continuity retention runbook"
            git push origin HEAD:integration/p0-staging-continuity-20261010
          fi
