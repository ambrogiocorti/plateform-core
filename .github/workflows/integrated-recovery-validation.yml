# Disposable GitHub-hosted infrastructure only: no hosted credentials or deployments.
# These results do not approve production backup, payment providers or physical printers.
name: Plateform integrated recovery validation

on:
  push:
    branches:
      - fix/release-edition-contracts-20261103
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plateform-integrated-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-browser:
    if: github.repository == 'ambrogiocorti/plateform-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      E2E_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      E2E_STORAGE: required
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated database and confirm Storage runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16 psmisc
          docker info
          npx playwright install --with-deps chromium
      - name: Exercise browser, Auth, API, database, Edge and real Storage
        run: npm run test:e2e:live
      - name: Preserve failure diagnostics from disposable services
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plateform-live-browser-failures
          path: |
            test-results/
            /tmp/plateform-e2e/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop and remove disposable services
        if: always()
        run: node tests/e2e-live/stack/stack.mjs down

  disaster-recovery:
    if: github.repository == 'ambrogiocorti/plateform-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      PLATEFORM_PG_BIN: /usr/lib/postgresql/16/bin
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install disposable PostgreSQL runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
      - name: Back up, destroy source and recover only from surviving replica
        run: npm run continuity:local-dr -- --evidence .local/release/local-dr-evidence.json
      - name: Preserve non-secret rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plateform-local-disaster-recovery
          path: .local/release/local-dr-evidence.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
