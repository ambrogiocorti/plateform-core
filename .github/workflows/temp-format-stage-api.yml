name: Temporary live stage preflight formatting
on:
  push:
    branches:
      - fix/p0-staging-target-guard-20261010
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize read-only staging API preflight scripts
        run: >-
          npx prettier --write
          scripts/verify-staging-api-reachability.mjs
          scripts/check-staging-api-reachability.mjs
      - name: Verify normalized scope
        run: >-
          npx prettier --check
          scripts/verify-staging-api-reachability.mjs
          scripts/check-staging-api-reachability.mjs
      - name: Commit only normalized scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-staging-api-reachability.mjs scripts/check-staging-api-reachability.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format remote staging API probes"
            git push origin HEAD:fix/p0-staging-target-guard-20261010
          fi
