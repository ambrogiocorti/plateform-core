name: Clean migration replay (isolated CI)
on:
  push:
    branches:
      - recovery/p0-canonical-migrations-20261010
      - integration/p0-recovery-format-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild_from_scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Verify 457 canonical files plus the two versioned recovery migrations
        run: node scripts/check-migrations.mjs
      - name: Fresh local PostgreSQL 17 and migration replay
        run: supabase db start
      - name: Validate fully applied history
        run: |
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 459
          supabase migration list --local
      - name: Compare structural baseline to live Development inventory
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          sql_count() {
            docker exec "$db_container" psql --username postgres --dbname postgres --no-align --tuples-only --command "$1" | tr -d '[:space:]'
          }
          test "$(sql_count "select count(*) from supabase_migrations.schema_migrations")" = "459"
          test "$(sql_count "select count(*) from pg_tables where schemaname='public'")" = "114"
          test "$(sql_count "select count(*) from pg_tables where schemaname='private'")" = "48"
          test "$(sql_count "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and not c.relrowsecurity")" = "0"
          test "$(sql_count "select count(*) from pg_tables where schemaname='private' and tablename like 'continuity_rehearsal_%'")" = "7"
          # Compare additional live Development catalog dimensions. These are
          # independently observed counts, except two intentionally omitted debug/rehearsal RPCs.
          # Exact routine identities are validated in the dedicated catalog parity workflow.
          test "$(sql_count "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private')")" = "551"
          test "$(sql_count "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname in ('public','private')")" = "311"
          test "$(sql_count "select count(*) from pg_policies where schemaname in ('public','private')")" = "110"
          test "$(sql_count "select count(*) from pg_indexes where schemaname in ('public','private')")" = "450"
          test "$(sql_count "select count(*) from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname in ('public','private')")" = "903"
          echo 'CLEAN_REPLAY_CATALOG_COUNT_PARITY=PASSED'
          echo 'CLEAN_REPLAY_SCHEMA_BASELINE=PASSED'
      - name: Stop ephemeral database
        if: always()
        run: supabase stop --no-backup || true
