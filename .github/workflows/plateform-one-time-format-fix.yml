# Restricted, one-shot maintainer formatter. This workflow must be removed after use.
name: Plateform one-time formatting repair
on:
  push:
    paths:
      - '.github/workflows/plateform-one-time-format-fix.yml'
permissions:
  contents: write
concurrency:
  group: plateform-one-time-format-fix
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'ambrogiocorti/plateform-core' && github.ref == 'refs/heads/plateform/two-phase-completion-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Install Prettier from locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exactly the 16 detected source/doc files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            docs/CI_EVIDENCE_2026-10-13.md \
            docs/CONTINUITY_REHEARSAL_BOOTSTRAP_2026-10-13.md \
            docs/DEPENDENCY_SECURITY_2026-10-13.md \
            docs/FOOD_COST_UI_2026-10-13.md \
            docs/MIGRATION_RECONCILIATION_2026-10-13.md \
            docs/TWO_PHASE_COMPLETION_2026-10-13.md \
            scripts/check-continuity-bootstrap-recovery.mjs \
            scripts/check-restore-target-occupancy.mjs \
            scripts/report-dependency-audit.mjs \
            src/api/client.ts \
            src/pages/catalog.ts \
            src/pages/configuration.ts \
            src/pages/food-cost.ts \
            tests/database/food-cost.test.ts \
            tests/e2e/staff-operations.spec.ts \
            tests/unit/food-cost.test.ts
          npm run format:check
          npm run check:migrations
          git diff --check
          git diff --exit-code -- supabase/migrations/ supabase/migration-manifest.json
      - name: Confirm allowed change-set and commit without touching historical SQL
        run: |
          set -euo pipefail
          cat > /tmp/allowed-files.txt <<'END_ALLOWED'
docs/CI_EVIDENCE_2026-10-13.md
docs/CONTINUITY_REHEARSAL_BOOTSTRAP_2026-10-13.md
docs/DEPENDENCY_SECURITY_2026-10-13.md
docs/FOOD_COST_UI_2026-10-13.md
docs/MIGRATION_RECONCILIATION_2026-10-13.md
docs/TWO_PHASE_COMPLETION_2026-10-13.md
scripts/check-continuity-bootstrap-recovery.mjs
scripts/check-restore-target-occupancy.mjs
scripts/report-dependency-audit.mjs
src/api/client.ts
src/pages/catalog.ts
src/pages/configuration.ts
src/pages/food-cost.ts
tests/database/food-cost.test.ts
tests/e2e/staff-operations.spec.ts
tests/unit/food-cost.test.ts
END_ALLOWED
          git diff --name-only | LC_ALL=C sort > /tmp/changed-files.txt
          LC_ALL=C sort /tmp/allowed-files.txt > /tmp/allowed-sorted.txt
          diff -u /tmp/allowed-sorted.txt /tmp/changed-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/CI_EVIDENCE_2026-10-13.md' 'docs/CONTINUITY_REHEARSAL_BOOTSTRAP_2026-10-13.md' 'docs/DEPENDENCY_SECURITY_2026-10-13.md' 'docs/FOOD_COST_UI_2026-10-13.md' 'docs/MIGRATION_RECONCILIATION_2026-10-13.md' 'docs/TWO_PHASE_COMPLETION_2026-10-13.md' 'scripts/check-continuity-bootstrap-recovery.mjs' 'scripts/check-restore-target-occupancy.mjs' 'scripts/report-dependency-audit.mjs' 'src/api/client.ts' 'src/pages/catalog.ts' 'src/pages/configuration.ts' 'src/pages/food-cost.ts' 'tests/database/food-cost.test.ts' 'tests/e2e/staff-operations.spec.ts' 'tests/unit/food-cost.test.ts'
          git commit -m 'style: format candidate sources and release documents'
      - name: Push formatting change to protected candidate branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 1
          gh auth setup-git
          git push origin HEAD:refs/heads/plateform/two-phase-completion-20261013
