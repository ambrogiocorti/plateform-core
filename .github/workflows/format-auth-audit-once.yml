name: Scoped Auth Audit Formatting (one time)
on:
  push:
    branches: [feat/audit-commercial-hardening-20261011]
    paths: [.github/workflows/format-auth-audit-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed Auth audit files only
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            supabase/functions/auth-audit-gateway/index.ts \
            src/auth/staff.ts \
            tests/database/audit-professional.test.ts \
            tests/database/harness.ts \
            supabase/migrations/20261011155756_audit_auth_gateway_rejected_login_mfa_service_only.sql \
            supabase/migrations/20261011160726_audit_retention_immutable_approval_gate_and_gateway_coverage.sql
      - name: Retire temporary formatting workflow
        run: rm .github/workflows/format-auth-audit-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format authenticated audit gateway and regression tests"
            git push origin HEAD:refs/heads/feat/audit-commercial-hardening-20261011
          fi
