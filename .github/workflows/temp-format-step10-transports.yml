name: Temporary transport test formatter
on:
  push:
    branches:
      - test/p0-realtime-ws-tenant-20261011
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize only the transport fixture
        run: npx prettier --write scripts/check-step10-auth-http.mjs
      - name: Check normalized fixture
        run: npx prettier --check scripts/check-step10-auth-http.mjs
      - name: Commit isolated formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-step10-auth-http.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Storage and Realtime HTTP transport tests"
            git push origin HEAD:test/p0-realtime-ws-tenant-20261011
          fi
