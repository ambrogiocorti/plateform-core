name: Format P0 continuity branch
on:
  push:
    branches:
      - fix/p0-continuity-capacity-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ambrogiocorti/plateform-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only P0 source and tests
        run: |
          npx prettier --write \
            supabase/functions/continuity-backup-worker/index.ts \
            supabase/functions/continuity-replica-receiver/index.ts \
            tests/unit/continuity-preflight-contract.test.ts
      - name: Commit format-only diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            supabase/functions/continuity-backup-worker/index.ts \
            supabase/functions/continuity-replica-receiver/index.ts \
            tests/unit/continuity-preflight-contract.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format continuity P0 sources and tests"
            git push
          fi
