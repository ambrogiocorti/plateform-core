name: Plateform format Admin UX gate (one-time)
on:
  push:
    branches: [feature/customer-experience-light-theme-20261027]
    paths: ['.github/workflows/plateform-fix-admin-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Admin static UX verification
        run: |
          node node_modules/prettier/bin/prettier.cjs --write scripts/check-admin-ux.mjs
          npm run format:check
      - name: Commit formatted verification source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/check-admin-ux.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(test): format Admin UX gate on staging candidate'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
