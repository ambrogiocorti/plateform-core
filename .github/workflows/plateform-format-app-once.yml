name: Plateform one-time design specification formatting
on:
  push:
    branches:
      - feature/customer-experience-light-theme-20261027
    paths:
      - '.github/workflows/plateform-format-app-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format exactly the app redesign files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            apps/public/main.ts apps/staff/main.ts \
            styles/public-app.css styles/staff-app.css \
            scripts/check-step11-static.mjs src/services/pwa.ts \
            docs/DESIGN_DECISIONS_2026-10-28.md
          npm run format:check
      - name: Commit reviewed formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/public/main.ts apps/staff/main.ts styles/public-app.css styles/staff-app.css scripts/check-step11-static.mjs src/services/pwa.ts docs/DESIGN_DECISIONS_2026-10-28.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format app-first Plateform redesign'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
