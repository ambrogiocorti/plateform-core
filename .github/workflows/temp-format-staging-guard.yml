name: Temporary staging guard formatting
on:
  push:
    branches:
      - fix/p0-staging-target-guard-20261010
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only the two staging guard scripts
        run: >-
          npx prettier --write
          scripts/verify-staging-project-binding.mjs
          scripts/check-staging-project-binding.mjs
      - name: Ensure formatter passed
        run: >-
          npx prettier --check
          scripts/verify-staging-project-binding.mjs
          scripts/check-staging-project-binding.mjs
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-staging-project-binding.mjs scripts/check-staging-project-binding.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize staging binding scripts"
            git push origin HEAD:fix/p0-staging-target-guard-20261010
          fi
