name: Temporary integrated formatting
on:
  push:
    branches:
      - integration/p0-recovery-format-20261010
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run format:check
      - name: Commit formatting-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize integrated recovery branch"
            git push origin HEAD:integration/p0-recovery-format-20261010
          fi
