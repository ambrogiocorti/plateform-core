name: P0 staging target guard
on:
  push:
    branches:
      - fix/p0-staging-target-guard-20261010
  pull_request:
permissions:
  contents: read
jobs:
  verify_binding:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test staging target binding fail-closed
        run: node --test scripts/check-staging-project-binding.mjs
      - name: Test live API reachability preflight using mocked transport
        run: node --test scripts/check-staging-api-reachability.mjs
      - name: Verify strict formatting
        run: >-
          npx prettier --check
          scripts/verify-staging-project-binding.mjs
          scripts/check-staging-project-binding.mjs
          scripts/verify-staging-api-reachability.mjs
          scripts/check-staging-api-reachability.mjs
          .github/workflows/staging-readiness.yml
          .github/workflows/staging-project-binding-test.yml
