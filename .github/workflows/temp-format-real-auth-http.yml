name: Temporary local JWT fixture formatting
on:
  push:
    branches:
      - test/p0-real-jwt-cross-venue-http-20261011
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only new local JWT fixture
        run: npx prettier --write scripts/check-step10-auth-http.mjs
      - name: Verify fixture formatting
        run: npx prettier --check scripts/check-step10-auth-http.mjs
      - name: Commit scoped formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-step10-auth-http.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize local MFA and HTTP regression fixture"
            git push origin HEAD:test/p0-real-jwt-cross-venue-http-20261011
          fi
