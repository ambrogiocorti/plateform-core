name: Plateform development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-step11-build-assembly.mjs --browser-node
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-browser-checks
          path: test-results/
          retention-days: 7
# Commercial packaging is a separate gate: npm run release:check / release:zip.
# Passing fixture tests never authorizes a production deployment or a sale-ready ZIP.
