# Real PostgreSQL fresh bootstrap, isolated in GitHub-hosted Docker.
# No Supabase API token, linked project, production key or client data is used.
name: Plateform isolated PostgreSQL bootstrap

on:
  push:
    branches:
      - plateform/two-phase-completion-20261013
    paths:
      - '.github/workflows/plateform-clean-bootstrap.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/migration-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plateform-clean-bootstrap
  cancel-in-progress: true

jobs:
  db-bootstrap:
    if: github.repository == 'ambrogiocorti/plateform-core' && github.ref == 'refs/heads/plateform/two-phase-completion-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - name: Checkout exact candidate commit without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Configure Node 24.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'

      - name: Install pinned Supabase CLI (no cloud login)
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0

      - name: Validate migration sources before starting Docker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:migrations
          supabase --version
          supabase db start --help

      - name: Rebuild application schema on a fresh local PostgreSQL
        timeout-minutes: 30
        run: |
          supabase db start

      - name: Verify actual PostgreSQL catalog and exact migration count
        run: |
          set -euo pipefail
          container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)
          test -n "$container"
          # Query returns only counts and flags. No customer data or secret is exported.
          got=$(docker exec "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "
          SELECT (SELECT count(*) FROM supabase_migrations.schema_migrations)::text
            || '|' || (SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='private' AND c.relname LIKE 'continuity_rehearsal_%' AND c.relkind IN ('r','p'))::text
            || '|' || (to_regclass('auth.users') IS NOT NULL)::text
            || '|' || (to_regclass('storage.objects') IS NOT NULL)::text;
          ")
          echo "LOCAL_BOOTSTRAP_CATALOG=$got"
          test "$got" = "483|7|true|true"
          echo "PLATEFORM_ISOLATED_POSTGRES_BOOTSTRAP=PASS"

      - name: Report non-sensitive diagnostics on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}} {{.Status}}' | grep '^supabase_' || true
          echo 'LOCAL_BOOTSTRAP_FAILED: review failing SQL/CLI step above; no remote resources were touched.'

# A local PostgreSQL clean bootstrap verifies schema replay, NOT that Auth,
# Storage, Edge, Realtime, backup/restore or paid providers function remotely.
# NEVER add --linked or --db-url to the local start/rebuild commands.
