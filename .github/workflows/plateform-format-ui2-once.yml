name: Plateform UI 2 one-time formatter

on:
  push:
    branches:
      - feature/customer-experience-light-theme-20261027
    paths:
      - '.github/workflows/plateform-format-ui2-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repo formatter on redesigned files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            styles/plateform-design-system.css \
            styles/public-app.css styles/staff-app.css \
            apps/public/main.ts apps/staff/main.ts \
            src/pages/public-menu.ts src/pages/customer.ts \
            scripts/check-step11-static.mjs scripts/check-visual-design.mjs \
            apps/public/index.html apps/staff/index.html \
            vite.pwa.ts .github/workflows/plateform-github-pages.yml \
            docs/PLATEFORM_UI_2_2026-10-28.md
          npm run format:check
      - name: Commit Prettier changes on feature only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            styles/plateform-design-system.css \
            styles/public-app.css styles/staff-app.css \
            apps/public/main.ts apps/staff/main.ts \
            src/pages/public-menu.ts src/pages/customer.ts \
            scripts/check-step11-static.mjs scripts/check-visual-design.mjs \
            apps/public/index.html apps/staff/index.html \
            vite.pwa.ts .github/workflows/plateform-github-pages.yml \
            docs/PLATEFORM_UI_2_2026-10-28.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): apply Prettier to complete redesign'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
