name: Plateform front desk structural format one-time
on:
  push:
    branches: [feature/customer-experience-light-theme-20261027]
    paths: ['.github/workflows/plateform-format-frontdesk-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply project formatter
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            src/pages/host.ts src/pages/cash.ts src/pages/waiter.ts \
            styles/frontdesk-v4.css apps/staff/main.ts \
            scripts/check-step11-static.mjs scripts/check-visual-design.mjs
          npm run format:check
      - name: Commit only the formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/host.ts src/pages/cash.ts src/pages/waiter.ts styles/frontdesk-v4.css apps/staff/main.ts scripts/check-step11-static.mjs scripts/check-visual-design.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(ux): format front desk redesign'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
