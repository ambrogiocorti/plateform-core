name: Plateform staging release verification
on:
  workflow_dispatch:
    inputs:
      staging_origin:
        description: 'Exact HTTPS staging origin already deployed on Vercel (no trailing slash)'
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    # Pinned PostgreSQL 16 runner for the disposable 39-scenario HTTP/JWT suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: staging
    env:
      PLATEFORM_STAGING_ORIGIN: ${{ inputs.staging_origin }}
      PUBLIC_SITE_ORIGIN: ${{ inputs.staging_origin }}
      VITE_ENVIRONMENT: staging
      VITE_PUBLIC_BASE_URL: ${{ inputs.staging_origin }}
      VITE_STAFF_BASE_URL: ${{ format('{0}/staff', inputs.staging_origin) }}
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_RELEASE_VERSION: '0.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify required environment
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'STAGING_SUPABASE_URL missing'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'STAGING_SUPABASE_PUBLISHABLE_KEY missing'; exit 1; }
          test -n "$PLATEFORM_STAGING_ORIGIN" || { echo 'Staging host missing'; exit 1; }
      - name: Reproduce dependency installation
        run: npm ci
      - name: Source formatting and full application verification
        run: |
          npm run format:check
          npm run check
      - name: Browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Integrated public and staff browser regression
        run: npm run test:e2e
      - name: Install isolated PostgreSQL and test-process cleanup utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16 psmisc
      - name: Integrated real GoTrue/PostgREST/PostgreSQL and Edge Function regression
        env:
          E2E_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          E2E_STORAGE: 'off'
          CI: 'true'
        run: npm run test:e2e:live
        # Storage-backed upload/archives and external payment providers require
        # separate hosted acceptance evidence: these are not covered by this job.
      - name: Verify remote migration history (read-only; fail on drift)
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo 'STAGING_SUPABASE_DB_URL missing'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          node scripts/reconcile-migrations.mjs --dry-run
      - name: Real Node 24 application build
        run: npm run build:pages
      - name: Check Staging browser CORS and deny unauthenticated requests (read-only)
        env:
          PLATEFORM_STAGING_URL: ${{ vars.STAGING_SUPABASE_URL }}
          PLATEFORM_STAGING_PROJECT_REF: qfgoatdabgnzozxuzxku
          PLATEFORM_PRODUCTION_PROJECT_REF: xzateqavvaparjoybbhr
          PLATEFORM_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PLATEFORM_STAGING_PREVIEW_ORIGIN: ${{ inputs.staging_origin }}
        run: |
          npm run check:staging-edge-cors
          npm run check:staging-edge-denial
      - name: Check live hosted HTTP headers and routing
        run: npm run check:staging-http
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plateform-staging-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
