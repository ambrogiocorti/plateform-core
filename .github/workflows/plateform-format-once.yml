name: Plateform temporary formatting repair

on:
  push:
    branches:
      - feature/customer-experience-light-theme-20261027
    paths:
      - '.github/workflows/plateform-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/customer-experience-light-theme-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact repository Prettier format to failing files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            docs/GITHUB_PAGES_HOSTING_2026-10-27.md \
            scripts/build-site.mjs \
            scripts/check-step11-static.mjs \
            src/services/public-site.ts \
            src/services/public-telemetry.ts \
            tests/unit/public-site.test.ts
          npm run format:check
      - name: Save formatting on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/GITHUB_PAGES_HOSTING_2026-10-27.md \
            scripts/build-site.mjs \
            scripts/check-step11-static.mjs \
            src/services/public-site.ts \
            src/services/public-telemetry.ts \
            tests/unit/public-site.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier to GitHub Pages candidate'
            git push origin HEAD:refs/heads/feature/customer-experience-light-theme-20261027
          fi
